<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="548" viewBox="0 0 1120 548">
  <title>KoApiDoc for Confluence</title>
  <!--
    Marketplace banner (1120 x 548): app name, partner name and what the app does.
    Own artwork only; no Atlassian, Confluence, Swagger or OpenAPI logos.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F3A5F" />
      <stop offset="1" stop-color="#14213D" />
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B4C78" />
      <stop offset="1" stop-color="#1A2B4F" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="1120" height="548" fill="url(#bg)" />

  <g font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Icon (same drawing as icon.svg, scaled) -->
    <g transform="translate(64 64) scale(0.75)">
      <rect width="144" height="144" rx="32" fill="url(#icon)" />
      <path d="M40 26 H88 L106 44 V118 H40 Z" fill="#F8FAFC" />
      <path d="M88 26 V44 H106 Z" fill="#CBD5E1" />
      <g fill="none" stroke="#F59E0B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M64 50 C57 50 55 53 55 58 V63 C55 67 53 69 48 69 C53 69 55 71 55 75 V80 C55 85 57 88 64 88" />
        <path d="M82 50 C89 50 91 53 91 58 V63 C91 67 93 69 98 69 C93 69 91 71 91 75 V80 C91 85 89 88 82 88" />
      </g>
      <rect x="52" y="98" width="42" height="6" rx="3" fill="#94A3B8" />
      <rect x="52" y="108" width="26" height="6" rx="3" fill="#94A3B8" />
    </g>

    <text x="64" y="250" fill="#F8FAFC" font-size="52" font-weight="700">KoApiDoc</text>
    <text x="64" y="300" fill="#CBD5E1" font-size="30" font-weight="500">for Confluence</text>
    <text x="64" y="372" fill="#F59E0B" font-size="24" font-weight="600">API documentation on your pages</text>
    <text x="64" y="410" fill="#CBD5E1" font-size="20">Renders OpenAPI and Swagger specifications</text>
    <text x="64" y="438" fill="#CBD5E1" font-size="20">from page attachments or pasted text.</text>
    <text x="64" y="500" fill="#94A3B8" font-size="18">by HunKonTech</text>

    <!-- Stylised API reference card (generic, not a product screenshot) -->
    <g transform="translate(600 70)" filter="url(#shadow)">
      <rect width="456" height="408" rx="18" fill="#F8FAFC" />
      <text x="32" y="58" fill="#14213D" font-size="26" font-weight="700">Bookshop API</text>
      <rect x="226" y="38" width="54" height="24" rx="12" fill="#64748B" />
      <text x="253" y="55" fill="#FFFFFF" font-size="14" font-weight="600" text-anchor="middle">1.0.0</text>
      <text x="32" y="90" fill="#475569" font-size="16">Books, orders and customers</text>

      <g font-size="16" font-weight="600">
        <rect x="32" y="118" width="392" height="50" rx="10" fill="#E0ECFF" />
        <rect x="44" y="130" width="72" height="26" rx="6" fill="#1D5FD6" />
        <text x="80" y="149" fill="#FFFFFF" text-anchor="middle">GET</text>
        <text x="132" y="149" fill="#14213D" font-family="ui-monospace, Menlo, Consolas, monospace">/books</text>

        <rect x="32" y="180" width="392" height="50" rx="10" fill="#DFF5E8" />
        <rect x="44" y="192" width="72" height="26" rx="6" fill="#18794E" />
        <text x="80" y="211" fill="#FFFFFF" text-anchor="middle">POST</text>
        <text x="132" y="211" fill="#14213D" font-family="ui-monospace, Menlo, Consolas, monospace">/orders</text>

        <rect x="32" y="242" width="392" height="50" rx="10" fill="#FFF1DC" />
        <rect x="44" y="254" width="72" height="26" rx="6" fill="#B45309" />
        <text x="80" y="273" fill="#FFFFFF" text-anchor="middle">PUT</text>
        <text x="132" y="273" fill="#14213D" font-family="ui-monospace, Menlo, Consolas, monospace">/books/{bookId}</text>

        <rect x="32" y="304" width="392" height="50" rx="10" fill="#FDE3E3" />
        <rect x="44" y="316" width="72" height="26" rx="6" fill="#B42318" />
        <text x="80" y="335" fill="#FFFFFF" text-anchor="middle">DELETE</text>
        <text x="132" y="335" fill="#14213D" font-family="ui-monospace, Menlo, Consolas, monospace">/orders/{orderId}</text>
      </g>
      <rect x="32" y="372" width="140" height="10" rx="5" fill="#CBD5E1" />
      <rect x="184" y="372" width="90" height="10" rx="5" fill="#E2E8F0" />
    </g>
  </g>
</svg>
