modules:
  macro:
    - key: koapidoc-macro
      title: KoApiDoc
      description: Render an OpenAPI / Swagger specification
      resource: macro-ui
      resolver:
        function: resolver
      config:
        resource: macro-ui # same bundle; App.tsx picks the mode from extension.macro.isConfiguring
        openOnInsert: true
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: macro-ui
    path: static/macro-ui/dist
permissions:
  # Read-only access to the attachments of the current page (step 2). Final list
  # before the first install, see docs/STEP-2.md; verify the names with `forge lint`.
  scopes:
    - read:attachment:confluence # v2: list attachments of a page, attachment metadata
    - readonly:content.attachment:confluence # v1: download attachment content
  # No `external` section on purpose: no egress keeps "Runs on Atlassian" possible.
app:
  runtime:
    name: nodejs22.x
  # Created by `forge register`; replace the placeholder before deploying.
  id: ari:cloud:ecosystem::app/REPLACE-WITH-ID-FROM-FORGE-REGISTER
