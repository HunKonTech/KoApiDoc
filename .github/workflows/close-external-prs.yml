name: Close external pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    # Only the maintainer may open pull requests. (repository_owner is the
    # HunKonTech organization, not a person, so it must not be used here.)
    if: >-
      github.event.pull_request.user.login != 'BenKoncsik' &&
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER'
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr close "$PR_URL" --comment "Köszönjük, de ez a repó külső pull requesteket nem fogad el. Hibát issue-ban jelezhetsz."
