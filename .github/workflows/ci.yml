name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            static/macro-ui/package-lock.json
      - run: npm ci
      - run: npm ci --prefix static/macro-ui
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: forge lint
        # `forge lint` needs a Forge login, so it only runs when the secrets are configured.
        if: ${{ env.FORGE_API_TOKEN != '' }}
        run: |
          npx forge settings set usage-analytics false
          npm run forge:lint

  e2e:
    # Headless browser tests on the local mock (no Atlassian access needed).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            static/macro-ui/package-lock.json
      - run: npm ci
      - run: npm ci --prefix static/macro-ui
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7
