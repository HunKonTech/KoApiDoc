name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            static/macro-ui/package-lock.json
      - run: npm ci
      - run: npm ci --prefix static/macro-ui
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # `forge lint` needs a Forge login, so it only runs when the secrets are configured.
      # The secrets are given to this step only, not to `npm ci` or the build.
      - name: Check for Forge credentials
        id: forge
        run: echo "configured=${{ secrets.FORGE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: forge lint
        if: ${{ steps.forge.outputs.configured == 'true' }}
        env:
          FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
        run: |
          npx forge settings set usage-analytics false
          npm run forge:lint

  e2e:
    # Headless browser tests on the local mock (no Atlassian access needed).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            static/macro-ui/package-lock.json
      - run: npm ci
      - run: npm ci --prefix static/macro-ui
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ failure() }}
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7
