name: Idea or feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. This repository does not accept pull requests, but ideas are welcome.
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what is missing, rather than a solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could KoApiDoc help?
