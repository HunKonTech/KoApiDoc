<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Defense in depth on top of the Forge CSP: a spec's Markdown may reference remote
      images (e.g. tracking pixels); those are never loaded. Only restricts what is listed.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="img-src 'self' data: blob:; object-src 'none'; base-uri 'self'"
    />
    <title>KoApiDoc</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
